name: Build and Release Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Verify Java environment
        run: |
          java -version
          echo "JAVA_HOME: $JAVA_HOME"
          JAVA_MAJOR_VERSION=$(java -version 2>&1 | head -n 1 | cut -d'"' -f2 | cut -d'.' -f1)
          echo "Detected Java Major Version: $JAVA_MAJOR_VERSION"
          if [ "$JAVA_MAJOR_VERSION" -ge 17 ]; then
            echo "Java version is 17 or newer."
          else
            echo "Error: Java version is lower than 17."
            exit 1
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ ! -f ./debug.keystore ]; then
            keytool -genkey -v -keystore ./debug.keystore -alias androiddebugkey -keypass android -storepass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          if [ -f ./debug.keystore ]; then
            echo "./debug.keystore exists."
          else
            echo "Error: Failed to create ./debug.keystore."
            exit 1
          fi

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify the APK
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$APK_PATH" ]; then
            echo "APK found at $APK_PATH"
            if [ -s "$APK_PATH" ]; then
              echo "APK is not empty."
            else
              echo "Error: APK is empty."
              exit 1
            fi
            if [[ "$APK_PATH" == *.apk ]]; then
              echo "File has .apk extension."
            else
              echo "Error: File does not have .apk extension."
              exit 1
            fi
          else
            echo "Error: Expected debug APK does not exist at $APK_PATH."
            echo "Searching in app/build/outputs/apk/:"
            find app/build/outputs/apk/ -name "*.apk"
            exit 1
          fi

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          RELEASE_DIR="release_assets"
          mkdir -p "$RELEASE_DIR"
          REPO_NAME=$(echo "${{ github.repository }}" | cut -d'/' -f2 | sed 's/[^a-zA-Z0-9._-]/_/g')
          RELEASE_FILENAME="${REPO_NAME}-debug-build-${{ github.run_number }}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "${RELEASE_DIR}/${RELEASE_FILENAME}"
          echo "asset_path=${RELEASE_DIR}/${RELEASE_FILENAME}" >> $GITHUB_OUTPUT
          echo "asset_name=${RELEASE_FILENAME}" >> $GITHUB_OUTPUT

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh --version
          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          if [ -f "$ASSET_PATH" ] && [ -s "$ASSET_PATH" ] && [[ "$ASSET_PATH" == *.apk ]]; then
            echo "Asset is valid: $ASSET_PATH"
          else
            echo "Error: Invalid release asset."
            exit 1
          fi
          TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          TITLE="Debug APK Build #${{ github.run_number }}"
          gh release create "$TAG" "$ASSET_PATH" \
            --title "$TITLE" \
            --target "${{ github.sha }}" \
            --latest \
            --notes "This is an automatically generated debug APK.
            
            - Built by GitHub Actions
            - Run number: ${{ github.run_number }}
            - Run attempt: ${{ github.run_attempt }}
            - Source commit: ${{ github.sha }}
            
            This APK is intended for testing and is not a Play Store production release. It is signed only with a temporary debug keystore."

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ steps.publish_release.outcome }}" == "success" ]; then
            TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
            TITLE="Debug APK Build #${{ github.run_number }}"
            RELEASE_URL=$(gh release view "$TAG" --json url -q .url)
            ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"
            echo "### Release Successful! 🚀" >> $GITHUB_STEP_SUMMARY
            echo "The debug APK is available for download." >> $GITHUB_STEP_SUMMARY
            echo "- **Release Title:** $TITLE" >> $GITHUB_STEP_SUMMARY
            echo "- **Release Tag:** $TAG" >> $GITHUB_STEP_SUMMARY
            echo "- **APK Asset:** $ASSET_NAME" >> $GITHUB_STEP_SUMMARY
            echo "- **Download URL:** [$RELEASE_URL]($RELEASE_URL)" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "The normal Actions artifact named \`app-debug-apk\` is also available as a backup." >> $GITHUB_STEP_SUMMARY
            
            echo "Release Tag: $TAG"
            echo "Release Title: $TITLE"
            echo "Release URL: $RELEASE_URL"
            echo "Asset Filename: $ASSET_NAME"
          else
            echo "### Release Failed ⚠️" >> $GITHUB_STEP_SUMMARY
            echo "Warning: GitHub Release publishing failed." >> $GITHUB_STEP_SUMMARY
            echo "However, the APK build succeeded and the artifact named \`app-debug-apk\` is available." >> $GITHUB_STEP_SUMMARY
            
            echo "Warning: Release publishing failed."
            echo "The APK build succeeded and the artifact named app-debug-apk remains available."
          fi
